 let rendered=false;const renderedPromise=renderer.whenRendered({timeoutMs:10000}).then(()=>rendered=true);
 renderer.update(0);renderer.render(mat4.create(),mat4.create(),{});await new Promise(r=>setTimeout(r,10));
 check(!ready&&!rendered,'Readiness does not resolve on incomplete placeholder draws');
 await renderer.loadTextures(async()=>white);await readyPromise;
 renderer.setPose(0,1);const camera=fitThumbnailCamera(renderer.getVisibleBounds(),128,128,[0,0,1]);
 await renderer.renderAsync(camera.view,camera.projection);await renderedPromise;
 check(rendered&&renderer.getFrame()===1,'First complete draw is awaited with frozen animation time');
 check(gl.getError()===gl.NO_ERROR,'WebGL draws finish without driver errors');renderer.destroy();gl.getExtension('WEBGL_lose_context')?.loseContext();
 const fixtures=new URLSearchParams(location.search);
 if(fixtures.has('mdl')&&fixtures.has('blp')) {
 const azerite=parseMDL(await (await fetch(fixtures.get('mdl'))).text());
 const blp=await (await fetch(fixtures.get('blp'))).arrayBuffer();
 const loadTexture=async(texture)=>{if(/Azerite01\.blp$/i.test(texture.Image))return{type:'blp',buffer:blp};throw new Error('Not supplied: '+texture.Image);};
 let rejected=false;try{await renderModelThumbnail(azerite,{width:256,height:256,loadTexture});}catch(error){rejected=/Missing textures/.test(error.message);}
 check(rejected,'Incomplete Azerite texture set rejects strict thumbnail capture');
 for(const sequence of [0,1,2]) {const result=await renderModelThumbnail(azerite,{width:256,height:256,loadTexture,allowMissingTextures:true,sequence,frameOffsetMs:sequence===0?1:500});
   check(result.missingTextures.length===4,'Azerite reports all four unavailable DDS textures');await show(result,azerite.Sequences[sequence].Name);}
 }
 status.textContent='PASS\n'+report.join('\n');document.body.dataset.result='pass';
}catch(error){status.textContent='FAIL\n'+error.stack+'\n'+report.join('\n');document.body.dataset.result='fail';}
